name: app
description: "Desktop and Android client for pingtunnel with easy Proxy/VPN switching."
publish_to: 'none'

version: 0.7.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.4
  shared_preferences: ^2.2.3
  window_manager: ^0.5.1
  crypto: ^3.0.3
  device_info_plus: ^10.0.0

  # Chiffrement AES de TunnelConfig
  encrypt: ^5.0.3

  # ANDROID_ID fiable (Settings.Secure.ANDROID_ID) pour le HWID unique
  android_id: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/scripts/linux/
    - assets/scripts/macos/
    - assets/scripts/windows/

  uses-material-design: true
